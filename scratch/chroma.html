<!DOCTYPE html>
<html>
<head>
  <title>Chroma Key Processor</title>
</head>
<body>
  <h3>Processing...</h3>
  <canvas id="canvas"></canvas>
  <script>
    const img = new Image();
    // Use cache-busting just in case
    img.src = '../public/hero-bottle-transparent.png?t=' + Date.now();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      // Crop the left and right wave sections
      // The bottle is situated in the middle ~44% of the width
      const cropLeft = Math.floor(img.width * 0.28);
      const cropWidth = Math.floor(img.width * 0.44);
      
      canvas.width = cropWidth;
      canvas.height = img.height;
      
      // Draw cropped center portion
      ctx.drawImage(img, cropLeft, 0, cropWidth, img.height, 0, 0, cropWidth, img.height);
      
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      
      // Filter out white/light background pixels to make them transparent
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i+1];
        const b = data[i+2];
        
        // Calculate average brightness
        const brightness = (r + g + b) / 3;
        
        if (brightness > 240) {
          // Smooth alpha transition to prevent jagged edges
          const alphaFactor = Math.max(0, (255 - brightness) / 15); // 0.0 to 1.0
          data[i+3] = Math.floor(data[i+3] * alphaFactor);
        }
      }
      
      ctx.putImageData(imgData, 0, 0);
      
      // Expose the transparent base64 image data
      window.resultBase64 = canvas.toDataURL('image/png');
      
      const indicator = document.createElement('div');
      indicator.id = 'done-indicator';
      indicator.innerText = 'PROCESSING_COMPLETE';
      document.body.appendChild(indicator);
    };
  </script>
</body>
</html>
